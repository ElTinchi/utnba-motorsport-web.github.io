name: Deploy a cPanel (FTP)

# Producción: https://utnbamotorsport.com.ar
# Deploy manual desde Actions -> "Deploy a cPanel (FTP)" -> Run workflow.
# La cuenta FTP se guarda en los Actions Secrets FTP_USERNAME y FTP_PASSWORD.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias y compilar (sitio React)
        run: |
          npm ci
          npm run build

      - name: Subir por FTP a public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.utnbamotorsport.com.ar
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: public_html/
          # Sin esto el .htaccess (archivo oculto) no se sube y las rutas
          # del sitio devuelven 404 en el servidor.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
