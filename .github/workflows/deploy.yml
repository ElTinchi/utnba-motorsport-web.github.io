name: Deploy a cPanel (FTP)

# ---------------------------------------------------------------------------
# ESTE WORKFLOW ES EL CAMINO VIEJO / DE RESPALDO.
#
# El destino de producción pasó a ser Cloudflare Pages (o Vercel) sobre
# utnbamotorsport.com.ar. Ninguno de los dos necesita este workflow: se conectan
# al repo de GitHub y buildean solos en cada push, con preview por rama y
# rollback a un click. Ver PROMPT-EJECUCION.md, sección "Hosting".
#
# Se deja acá porque:
#   - hasta que el DNS esté apuntado, el cPanel sigue siendo el que sirve;
#   - si alguna vez hay que volver, ya está andando.
#
# Cuando Cloudflare/Vercel esté funcionando y el cPanel no se use más, se borra.
#
# OJO si se sigue usando: el sitio necesita el fallback de SPA para que las
# rutas no tiren 404. Eso lo resuelve public/.htaccess, que se copia a dist/ en
# el build. Si el cPanel tiene AllowOverride en None, el .htaccess se ignora y
# hay que pedirle al hosting que lo habilite.
# ---------------------------------------------------------------------------

# Deploy MANUAL: se dispara desde la pestaña Actions -> "Deploy a cPanel (FTP)" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias y compilar (sitio React)
        run: |
          npm ci
          npm run build

      - name: Subir por FTP a public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: public_html/
          # Sin esto el .htaccess (archivo oculto) no se sube y las rutas
          # del sitio devuelven 404 en el servidor.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
